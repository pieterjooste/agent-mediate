name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Version Lock, Build, TypeScript & Python SDK Suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify git tag matches all npm, MCP Registry, and PyPI package versions
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const rawTag = process.env.RAW_TAG ?? "";
            assert.match(rawTag, /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/, `Expected vX.Y.Z tag, got ${rawTag}`);
            const expected = rawTag.slice(1);
            for (const p of [
              "packages/core/package.json",
              "packages/protocol/package.json",
              "packages/sdk/package.json",
              "packages/mcp/package.json",
              "packages/mcp/server.json",
            ]) {
              const json = JSON.parse(readFileSync(p, "utf8"));
              assert.equal(json.version, expected, `${p} version ${json.version} !== ${expected}`);
              if (Array.isArray(json.packages)) {
                for (const pkg of json.packages) {
                  assert.equal(pkg.version, expected, `${p} packages[].version ${pkg.version} !== ${expected}`);
                }
              }
            }
            const pyproject = readFileSync("packages/python/pyproject.toml", "utf8");
            const pyMatch = /^version\s*=\s*"([^"]+)"/m.exec(pyproject);
            assert.equal(pyMatch?.[1], expected, `packages/python/pyproject.toml version ${pyMatch?.[1]} !== ${expected}`);
            console.log(`Verified release version ${expected} across all 6 manifests.`);
          '

      - name: Install dependencies (lifecycle scripts disabled)
        run: npm ci --ignore-scripts

      - name: Verify publishable workspace tarballs and exports
        run: npm pack --dry-run -w @agent-mediate/core -w @agent-mediate/protocol -w @agent-mediate/sdk -w @agent-mediate/mcp

      - name: Run typecheck, Python unit tests, and Node SDK/Core/Protocol test suite
        run: npm run check

  publish:
    name: Publish to npm & PyPI via OIDC Trusted Publishing
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: npm install -g npm@^11.6.0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv for PEP 740 OIDC PyPI publishing
        run: python3 -m pip install --upgrade "uv>=0.6.0"

      - name: Install workspace dependencies (lifecycle scripts disabled)
        run: npm ci --ignore-scripts

      - name: Publish npm workspaces in topological order with SLSA provenance
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VER="${RAW_TAG#v}"
          for PKG in @agent-mediate/core @agent-mediate/protocol @agent-mediate/sdk @agent-mediate/mcp; do
            if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
              echo "Skipping ${PKG}@${VER} (already published on npm)"
            else
              echo "Publishing ${PKG}@${VER} via GitHub OIDC Trusted Publisher..."
              npm publish -w "${PKG}" --provenance --access public
            fi
          done

      - name: Build & publish Python SDK (agent-mediate) to PyPI via OIDC Trusted Publisher
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VER="${RAW_TAG#v}"
          STATUS="$(curl -sSo /dev/null -w '%{http_code}' "https://pypi.org/pypi/agent-mediate/${VER}/json")"
          if [ "$STATUS" = "200" ]; then
            echo "Skipping agent-mediate==${VER} (already published on PyPI)"
          else
            uv build packages/python
            uv publish packages/python/dist/*
          fi
