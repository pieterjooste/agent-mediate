name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript & Python Suites + Tarball Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies (lifecycle scripts disabled)
        run: npm ci --ignore-scripts

      - name: Audit production npm dependencies (IT5-P2-2)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify publishable workspace tarballs and exports
        run: npm pack --dry-run -w @agent-mediate/core -w @agent-mediate/protocol -w @agent-mediate/sdk -w @agent-mediate/mcp

      - name: Run typecheck, Python unit tests, and Node SDK/Core/Protocol test suite
        run: npm run check
